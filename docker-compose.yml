# K8s-free fallback for quick iteration: dispatcher + Redis only.
#
# Reviews are NOT runnable here — the dispatcher creates reviewer Pods through
# the Kubernetes API, so POST /review returns 503 SERVICE_UNAVAILABLE without a
# cluster. Use this to iterate on routes, validation and health; use
# ./scripts/minikube-setup.sh to run an actual review.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dispatcher:
    build:
      context: .
      dockerfile: packages/dispatcher/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      # Knowledge store (v7) — optional; empty disables with a warning
      - MONGODB_URI=${MONGODB_URI:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
