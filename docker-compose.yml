# K8s-free fallback for quick iteration: dispatcher + Redis only.
#
# Reviews are NOT runnable here — the dispatcher creates reviewer Pods through
# the Kubernetes API, so POST /review returns 503 SERVICE_UNAVAILABLE without a
# cluster. Use this to iterate on routes, validation and health; use
# ./scripts/minikube-setup.sh to run an actual review.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local MongoDB with Atlas Search/Vector Search (mongot) — the knowledge
  # store's $vectorSearch works here, unlike plain community mongod.
  # Exposed on 27021 to avoid clashing with other local Mongo containers.
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    restart: unless-stopped
    ports:
      - "27021:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dispatcher:
    build:
      context: .
      dockerfile: packages/dispatcher/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      # Knowledge store (v7) — optional; empty disables with a warning.
      # Default URI targets the local atlas-local service below.
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # Keys provisioned via MongoDB Atlas need https://ai.mongodb.com
      - VOYAGE_BASE_URL=${VOYAGE_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Public tunnel for the GitHub webhook (v7). Opt-in profile — exposes the
  # MINIKUBE dispatcher (the one that can actually run reviews), not the
  # compose one. Quick tunnel: no Cloudflare account, random trycloudflare
  # URL printed in the logs:
  #   TUNNEL_TARGET=$(minikube service kitten-dispatcher -n kitten --url) \
  #     docker compose --profile webhook up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["webhook"]
    network_mode: host
    command: tunnel --no-autoupdate --url ${TUNNEL_TARGET:-http://localhost:3001}
    restart: unless-stopped

volumes:
  mongo-data:
