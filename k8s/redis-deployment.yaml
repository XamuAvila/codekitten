apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitten-redis
  namespace: kitten
  labels:
    app: kitten-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitten-redis
  template:
    metadata:
      labels:
        app: kitten-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
