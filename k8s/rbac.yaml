apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kitten-pod-manager
  namespace: kitten
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kitten-pod-manager-binding
  namespace: kitten
subjects:
  - kind: ServiceAccount
    name: default
    namespace: kitten
roleRef:
  kind: Role
  name: kitten-pod-manager
  apiGroup: rbac.authorization.k8s.io
