apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitten-dispatcher
  namespace: kitten
  labels:
    app: kitten-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitten-dispatcher
  template:
    metadata:
      labels:
        app: kitten-dispatcher
    spec:
      containers:
        - name: dispatcher
          image: kitten-dispatcher:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              value: "redis://redis.kitten.svc.cluster.local:6379"
            - name: K8S_NAMESPACE
              value: "kitten"
            - name: REVIEWER_IMAGE
              value: "kitten-reviewer:latest"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kitten-github-token
                  key: token
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: kitten-webhook-secret
                  key: secret
                  optional: true
            - name: TRIGGER_WORD
              value: "@reviewer"
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
            requests:
              memory: "128Mi"
              cpu: "100m"
